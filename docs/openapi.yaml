openapi: 3.0.3
info:
  title: Wishlist API
  description: >
    A Laravel back-end API for an e-commerce wishlist feature: registration,
    token login, product browsing/search, and per-user wishlist management.
  version: "1.0.0"
servers:
  - url: http://127.0.0.1:8000/api
    description: Local development
tags:
  - name: Auth
  - name: Products
  - name: Wishlist

paths:
  /register:
    post:
      tags: [Auth]
      summary: Create an account and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Ada Lovelace }
                email: { type: string, format: email, example: ada@example.com }
                password: { type: string, format: password, minLength: 8, example: secret123 }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '422':
          description: Validation failed (missing field, bad email, or email already taken)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /login:
    post:
      tags: [Auth]
      summary: Log in and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '401':
          description: >
            Invalid credentials. Returned identically whether the email
            doesn't exist or the password is wrong, so login cannot be used
            to enumerate registered accounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { success: false, message: "Invalid credentials.", errors: null }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the token used for this request
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessNullData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /products:
    get:
      tags: [Products]
      summary: List available (active) products — search, sort, paginate
      security: []
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
          description: Matches against name OR description, case-insensitive
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, price, -price, created_at, -created_at]
            default: -created_at
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 15 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          products:
                            type: array
                            items: { $ref: '#/components/schemas/Product' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /products/{product}:
    get:
      tags: [Products]
      summary: Get a single product (any status — including delisted)
      security: []
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          product: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wishlist:
    get:
      tags: [Wishlist]
      summary: View the authenticated user's wishlist
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wishlist:
                            type: array
                            items: { $ref: '#/components/schemas/WishlistItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Wishlist]
      summary: Add a product to the authenticated user's wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: integer, example: 1 }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wishlist_item: { $ref: '#/components/schemas/WishlistItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Product is already on this user's wishlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { success: false, message: "Product is already in your wishlist.", errors: null }
        '422':
          description: >
            product_id is missing/invalid, doesn't exist, or references a
            delisted (inactive) product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              examples:
                delisted:
                  value: { success: false, message: "The given data was invalid.", errors: { product_id: ["This product is no longer available and cannot be added to a wishlist."] } }
                invalid:
                  value: { success: false, message: "The given data was invalid.", errors: { product_id: ["The selected product id is invalid."] } }
    delete:
      tags: [Wishlist]
      summary: Clear the authenticated user's entire wishlist
      responses:
        '200':
          description: Cleared (safe to call on an already-empty wishlist)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          removed_count: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /wishlist/{product}:
    delete:
      tags: [Wishlist]
      summary: Remove one product from the authenticated user's wishlist
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessNullData' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: >
            The product doesn't exist, or exists but isn't on this user's
            wishlist (including if it's on someone else's — that is never
            revealed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                not_on_list:
                  value: { success: false, message: "Product is not in your wishlist.", errors: null }
                no_such_product:
                  value: { success: false, message: "Resource not found.", errors: null }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Sanctum personal access token"
  responses:
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, message: "Unauthenticated.", errors: null }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, message: "Resource not found.", errors: null }
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TooManyRequests:
      description: Rate limit exceeded (5 requests/minute per IP, shared by register and login)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, message: "Too many attempts. Please try again later.", errors: null }
  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Ada Lovelace }
        email: { type: string, example: ada@example.com }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Product:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Wireless Mouse }
        slug: { type: string, example: wireless-mouse }
        description: { type: string, nullable: true }
        price: { type: string, example: "24.99" }
        currency: { type: string, example: USD }
        status: { type: string, enum: [active, inactive] }
        is_wishlisted:
          type: boolean
          description: True only when the request is authenticated and this product is on that user's wishlist
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WishlistItem:
      type: object
      properties:
        id: { type: integer, description: Wishlist entry id }
        product: { $ref: '#/components/schemas/Product' }
        added_at: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { type: object }
    SuccessNullData:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { nullable: true, example: null }
    AuthSuccess:
      allOf:
        - $ref: '#/components/schemas/Success'
        - type: object
          properties:
            data:
              type: object
              properties:
                user: { $ref: '#/components/schemas/User' }
                token: { type: string, example: "1|xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors: { nullable: true }
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
              example: { email: ["The email field is required."] }

security:
  - bearerAuth: []
